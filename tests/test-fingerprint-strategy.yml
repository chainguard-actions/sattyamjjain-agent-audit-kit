name: Test fingerprint-strategy input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan-disabled
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert scan with disabled fingerprints completed
        env:
          OUTCOME: ${{ steps.scan-disabled.outcome }}
          EXIT_CODE: ${{ steps.scan-disabled.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-disabled.outputs.findings-count }}
          SARIF_FILE: ${{ steps.scan-disabled.outputs.sarif-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          echo "sarif-file: $SARIF_FILE"

          # With fail-on: none, the scan should always succeed
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with fail-on=none but got '$OUTCOME'"
            exit 1
          fi

          # findings-count should be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi

          # sarif-file output should be set
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi

          echo "PASS: fingerprint-strategy=disabled scan completed with valid outputs"

      - id: scan-line-hash
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'
        continue-on-error: true

      - name: Assert scan with line-hash fingerprints completed
        env:
          OUTCOME: ${{ steps.scan-line-hash.outcome }}
          FINDINGS: ${{ steps.scan-line-hash.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"

          # With fail-on: none, the scan should always succeed
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with fail-on=none but got '$OUTCOME'"
            exit 1
          fi

          # findings-count should be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi

          echo "PASS: fingerprint-strategy=line-hash scan completed with valid outputs"
