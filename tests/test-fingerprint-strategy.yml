name: Test fingerprint strategy disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert exit-code is 0 (fail-on=none)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 when fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0"

      - name: Assert SARIF file exists
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          echo "Checking SARIF at: $SARIF_PATH"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: SARIF file not found"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF has no partialFingerprints when strategy is disabled
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          cat > /tmp/check_fingerprints.py << 'PYEOF'
          import json, sys, os
          sarif_path = os.environ.get("SARIF_PATH", "")
          with open(sarif_path) as f:
              data = json.load(f)
          results = data.get("runs", [{}])[0].get("results", [])
          for r in results:
              if r.get("partialFingerprints"):
                  print("FAIL: found partialFingerprints when fingerprint-strategy=disabled")
                  sys.exit(1)
          print("PASS: no partialFingerprints found (fingerprint-strategy=disabled)")
          PYEOF
          SARIF_PATH="$SARIF_PATH" python3 /tmp/check_fingerprints.py

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a valid non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"
