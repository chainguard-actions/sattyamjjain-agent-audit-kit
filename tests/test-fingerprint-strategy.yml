name: Test fingerprint strategy options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan-disabled
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert disabled fingerprint scan completed
        env:
          FINDINGS: ${{ steps.scan-disabled.outputs.findings-count }}
          SARIF_FILE: ${{ steps.scan-disabled.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan-disabled.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-disabled.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: scan completed with outcome '$OUTCOME'"

          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS'"

          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file='$SARIF_FILE'"

      - id: scan-line-hash
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'
        continue-on-error: true

      - name: Assert line-hash fingerprint scan completed
        env:
          FINDINGS: ${{ steps.scan-line-hash.outputs.findings-count }}
          SARIF_FILE: ${{ steps.scan-line-hash.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan-line-hash.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-line-hash.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: line-hash fingerprint scan completed with outcome '$OUTCOME'"

          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS'"
