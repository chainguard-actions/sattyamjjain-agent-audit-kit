name: Test fingerprint strategy options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan-line-hash
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'

      - name: Assert line-hash scan produced outputs
        env:
          FINDINGS: ${{ steps.scan-line-hash.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan-line-hash.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan-line-hash.outputs.sarif-file }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: line-hash fingerprint strategy scan succeeded"

      - name: Move SARIF file before next scan
        run: |
          if [ -f "$GITHUB_WORKSPACE/agent-audit-results.sarif" ]; then
            mv "$GITHUB_WORKSPACE/agent-audit-results.sarif" "$GITHUB_WORKSPACE/agent-audit-results-line-hash.sarif"
          fi

      - id: scan-disabled
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert disabled fingerprint scan produced outputs
        env:
          FINDINGS: ${{ steps.scan-disabled.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan-disabled.outputs.exit-code }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: disabled fingerprint strategy scan succeeded"
