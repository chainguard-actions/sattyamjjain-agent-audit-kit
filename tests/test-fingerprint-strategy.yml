name: Test fingerprint-strategy options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan-line-hash
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'

      - name: Assert line-hash scan exit-code is 0
        env:
          EXIT_CODE: ${{ steps.scan-line-hash.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0"

      - name: Assert line-hash scan findings-count is numeric
        env:
          FINDINGS: ${{ steps.scan-line-hash.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert SARIF file is valid and has fingerprints
        run: |
          python3 -c "
          import json
          with open('$GITHUB_WORKSPACE/agent-audit-results.sarif') as f:
              sarif = json.load(f)
          assert 'runs' in sarif, 'Missing runs key in SARIF'
          run = sarif['runs'][0]
          results = run.get('results', [])
          print('Total results:', len(results))
          # If there are results, check that fingerprints are present (line-hash mode)
          if results:
              first = results[0]
              fps = first.get('fingerprints', {})
              print('Fingerprints on first result:', fps)
              if not fps:
                  print('WARNING: no fingerprints on first result (may be expected for some rule types)')
          print('PASS: SARIF structure valid')
          "
