name: Test fingerprint-strategy input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Test with fingerprint-strategy=disabled
      - id: scan-disabled
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert scan with fingerprint-strategy=disabled completed
        env:
          OUTCOME: ${{ steps.scan-disabled.outcome }}
          EXIT_CODE: ${{ steps.scan-disabled.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-disabled.outputs.findings-count }}
          SARIF_FILE: ${{ steps.scan-disabled.outputs.sarif-file }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "exit-code:      $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          echo "sarif-file:     $SARIF_FILE"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: scan step failed unexpectedly"
            exit 1
          fi

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          # sarif-file output must be set
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi

          echo "PASS: fingerprint-strategy=disabled scan completed successfully"

      # Test with fingerprint-strategy=line-hash
      - id: scan-linehash
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'
        continue-on-error: true

      - name: Assert scan with fingerprint-strategy=line-hash completed
        env:
          OUTCOME: ${{ steps.scan-linehash.outcome }}
          EXIT_CODE: ${{ steps.scan-linehash.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-linehash.outputs.findings-count }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "exit-code:      $EXIT_CODE"
          echo "findings-count: $FINDINGS"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: scan step failed unexpectedly"
            exit 1
          fi

          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          echo "PASS: fingerprint-strategy=line-hash scan completed successfully"
