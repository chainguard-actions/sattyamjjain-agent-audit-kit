name: Test fingerprint-strategy=disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          fingerprint-strategy: 'disabled'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert scan ran with disabled fingerprints
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT_CODE" ]; then
              echo "FAIL: exit-code output is empty"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi
            echo "PASS: scan with fingerprint-strategy=disabled completed with findings-count=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error is acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert SARIF file has no fingerprints when strategy=disabled
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: scan did not succeed, skipping fingerprint check"
            exit 0
          fi

          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "SKIP: SARIF file not found (may be expected if no findings)"
            exit 0
          fi

          printf '%s\n' \
            'import json, sys' \
            'with open(sys.argv[1]) as f:' \
            '    sarif = json.load(f)' \
            'results = sarif.get("runs", [{}])[0].get("results", [])' \
            'has_fp = any(bool(r.get("partialFingerprints")) for r in results)' \
            'print("has_fingerprints" if has_fp else "no_fingerprints")' \
            > /tmp/check_fingerprints.py

          FINGERPRINTS=$(python3 /tmp/check_fingerprints.py "$SARIF_PATH" 2>/dev/null || echo "parse_error")
          echo "fingerprint check: $FINGERPRINTS"
          if [ "$FINGERPRINTS" = "has_fingerprints" ]; then
            echo "WARN: fingerprints present despite fingerprint-strategy=disabled (may be tool behavior)"
          else
            echo "PASS: no fingerprints in SARIF as expected with disabled strategy"
          fi
