name: Test fingerprint-strategy input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with fingerprint-strategy=line-hash
      - id: scan-line-hash
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'

      - name: Assert line-hash fingerprint strategy works
        env:
          OUTCOME: ${{ steps.scan-line-hash.outcome }}
          EXIT_CODE: ${{ steps.scan-line-hash.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan-line-hash.outputs.sarif-file }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "exit-code:  $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action step failed with fingerprint-strategy=line-hash"
            exit 1
          fi

          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi

          echo "PASS: line-hash fingerprint strategy accepted"

      # Test with fingerprint-strategy=disabled
      - id: scan-disabled
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert disabled fingerprint strategy works
        env:
          OUTCOME: ${{ steps.scan-disabled.outcome }}
          EXIT_CODE: ${{ steps.scan-disabled.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan-disabled.outputs.sarif-file }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "exit-code:  $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action step failed with fingerprint-strategy=disabled"
            exit 1
          fi

          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi

          echo "PASS: disabled fingerprint strategy accepted"
