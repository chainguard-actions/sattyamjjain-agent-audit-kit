name: Test fingerprint-strategy input
on:
  workflow_dispatch:

jobs:
  test-fingerprint-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "# Test project" > "$GITHUB_WORKSPACE/scan-target/README.md"

      - id: scan-disabled
        uses: .
        with:
          path: 'scan-target'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert scan with fingerprint-strategy=disabled ran successfully
        env:
          OUTCOME: ${{ steps.scan-disabled.outcome }}
          FINDINGS: ${{ steps.scan-disabled.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan-disabled.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan-disabled.outputs.sarif-file }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code:      $EXIT_CODE"
          echo "sarif-file:     $SARIF_FILE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (fail-on=none), got outcome=$OUTCOME"
            exit 1
          fi

          # exit-code must not be 2 (error)
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned exit-code=2 (error)"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

          # sarif-file output must be set
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS (fingerprint-strategy=disabled)"

      - id: scan-line-hash
        uses: .
        with:
          path: 'scan-target'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'line-hash'
        continue-on-error: true

      - name: Assert scan with fingerprint-strategy=line-hash ran successfully
        env:
          OUTCOME: ${{ steps.scan-line-hash.outcome }}
          EXIT_CODE: ${{ steps.scan-line-hash.outputs.exit-code }}
        run: |
          echo "outcome:   $OUTCOME"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (fail-on=none), got outcome=$OUTCOME"
            exit 1
          fi

          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned exit-code=2 (error)"
            exit 1
          fi
          echo "PASS: fingerprint-strategy=line-hash accepted"
