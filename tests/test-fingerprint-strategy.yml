name: Test fingerprint-strategy disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert exit-code is 0 (fail-on=none)
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 when fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS_COUNT'"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS_COUNT' is a valid number"

      - name: Assert SARIF file exists and check fingerprint structure
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: SARIF file not found at $SARIF_PATH"
            exit 1
          fi
          echo "PASS: SARIF file exists"
          python3 - "$SARIF_PATH" <<'PYEOF'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              sarif = json.load(f)
          results = sarif.get('runs', [{}])[0].get('results', [])
          for r in results:
              fp = r.get('partialFingerprints', {})
              if fp:
                  print('INFO: result has partialFingerprints: ' + str(fp))
          print('PASS: SARIF structure is valid with fingerprint-strategy=disabled')
          PYEOF
