name: Test critical severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code='$EXIT_CODE'"

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count='$FINDINGS'"

      - name: Assert critical-count is a number
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL'"
            exit 1
          fi
          echo "PASS: critical-count='$CRITICAL'"

      - name: Assert SARIF file exists in workspace
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file: $GITHUB_WORKSPACE/$SARIF_FILE"
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF_FILE" ]; then
            echo "FAIL: SARIF file not found at $GITHUB_WORKSPACE/$SARIF_FILE"
            exit 1
          fi
          echo "PASS: SARIF file exists"
