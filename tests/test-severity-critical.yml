name: Test critical severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code is 0 or 1 (not an error)
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned error exit code 2"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE' (not an error)"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is a valid integer: $FINDINGS"

      - name: Assert critical-count is a non-negative integer
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count '$CRITICAL' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: critical-count is a valid integer: $CRITICAL"
