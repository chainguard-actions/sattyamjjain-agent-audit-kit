name: Test severity=critical filtering
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan-critical
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert critical scan outputs are set and valid
        env:
          FINDINGS: ${{ steps.scan-critical.outputs.findings-count }}
          CRITICAL: ${{ steps.scan-critical.outputs.critical-count }}
          HIGH: ${{ steps.scan-critical.outputs.high-count }}
          EXIT_CODE: ${{ steps.scan-critical.outputs.exit-code }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "exit-code: $EXIT_CODE"

          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count was not set"
            exit 1
          fi
          if [ -z "$CRITICAL" ]; then
            echo "FAIL: critical-count was not set"
            exit 1
          fi
          if [ -z "$HIGH" ]; then
            echo "FAIL: high-count was not set"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code was not set"
            exit 1
          fi

          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned error exit code 2"
            exit 1
          fi

          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: $CRITICAL"
            exit 1
          fi
          if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count is not a non-negative integer: $HIGH"
            exit 1
          fi

          echo "PASS: all outputs are valid"

      - name: Assert critical-count is less than or equal to findings-count
        env:
          FINDINGS: ${{ steps.scan-critical.outputs.findings-count }}
          CRITICAL: ${{ steps.scan-critical.outputs.critical-count }}
        run: |
          echo "findings-count: $FINDINGS, critical-count: $CRITICAL"
          if [ "$CRITICAL" -gt "$FINDINGS" ]; then
            echo "FAIL: critical-count ($CRITICAL) > findings-count ($FINDINGS)"
            exit 1
          fi
          echo "PASS: critical-count <= findings-count"
