name: Test critical severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert critical-only scan ran and outputs are numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          EXIT: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count:     $HIGH"
          echo "exit-code:      $EXIT"

          if [ "$OUTCOME" = "success" ]; then
            # exit-code must be set and numeric
            if [ -z "$EXIT" ]; then
              echo "FAIL: exit-code output is empty"
              exit 1
            fi
            if ! echo "$EXIT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: exit-code is not numeric: '$EXIT'"
              exit 1
            fi
            # findings-count must be numeric (may be 0 with critical-only filter)
            if [ -n "$FINDINGS" ] && ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not numeric: '$FINDINGS'"
              exit 1
            fi
            # critical-count must be numeric
            if [ -n "$CRITICAL" ] && ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count is not numeric: '$CRITICAL'"
              exit 1
            fi
            echo "PASS: critical-severity scan succeeded, findings=$FINDINGS critical=$CRITICAL high=$HIGH exit-code=$EXIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
