name: Test critical severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert outputs are set and counts are valid integers
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "exit-code: $EXIT_CODE"

          for val in "$FINDINGS" "$CRITICAL" "$HIGH" "$EXIT_CODE"; do
            if [ -z "$val" ]; then
              echo "FAIL: one or more outputs are empty"
              exit 1
            fi
          done

          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: $CRITICAL"
            exit 1
          fi
          if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count is not a non-negative integer: $HIGH"
            exit 1
          fi

          echo "PASS: all outputs are valid non-negative integers"

      - name: Assert exit-code is 0 with fail-on=none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0"

      - name: Assert critical-count does not exceed findings-count
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          if [ "$CRITICAL" -gt "$FINDINGS" ]; then
            echo "FAIL: critical-count ($CRITICAL) exceeds findings-count ($FINDINGS)"
            exit 1
          fi
          echo "PASS: critical-count <= findings-count"
