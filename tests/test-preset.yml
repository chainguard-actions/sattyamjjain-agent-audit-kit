name: Test preset rule activation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          preset: 'mcp-ox-2026-04'

      - name: Assert scan completed without error
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          # Outcome must be success or failure (not skipped)
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          # exit-code must be 0 or 1 (not 2=error)
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned error exit code 2 (preset may be invalid)"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

      - name: Assert all outputs are set and numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "sarif-file: $SARIF"

          for val in "$FINDINGS" "$CRITICAL" "$HIGH"; do
            if [ -z "$val" ]; then
              echo "FAIL: a count output is empty"
              exit 1
            fi
            if ! echo "$val" | grep -qE '^[0-9]+$'; then
              echo "FAIL: count output is not a non-negative integer: $val"
              exit 1
            fi
          done

          if [ -z "$SARIF" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi

          echo "PASS: all outputs set correctly with preset=mcp-ox-2026-04"
