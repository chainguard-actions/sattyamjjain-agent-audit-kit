name: Test MCP preset scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          preset: 'mcp-ox-2026-04'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert preset scan outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action step itself failed unexpectedly with preset=mcp-ox-2026-04"
            exit 1
          fi

          # sarif-file output should be set
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file output is '$SARIF_FILE'"

          # findings-count should be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

          # exit-code should be 0 since fail-on=none
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code=0 as expected with fail-on=none"
