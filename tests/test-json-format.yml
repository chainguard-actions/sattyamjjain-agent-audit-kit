name: Test scan with JSON format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action ran and outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action step failed unexpectedly"
            exit 1
          fi

          # exit-code output should be set
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

          # findings-count should be a number
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a number"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"
