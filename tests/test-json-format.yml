name: Test JSON format output
on:
  workflow_dispatch:

jobs:
  test-json-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        name: Run AgentAuditKit scan with JSON format
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS is a valid number"
