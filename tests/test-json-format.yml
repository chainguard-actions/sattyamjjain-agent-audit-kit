name: Test JSON format scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert exit-code output is set and numeric
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: exit-code is not numeric: $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"
