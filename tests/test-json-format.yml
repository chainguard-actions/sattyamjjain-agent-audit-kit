name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale output
        run: rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
      - id: action
        uses: .
        with:
          path: tests/fixtures/vulnerable
          format: json
          fail-on: none
          upload-sarif: 'false'
          comment-on-pr: 'false'
      - name: Assert outputs
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "exit-code=$EXIT_CODE sarif-file=$SARIF"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit-code 0"; exit 1; fi
          if [ "$SARIF" != "agent-audit-results.sarif" ]; then echo "FAIL: unexpected sarif-file"; exit 1; fi
          echo "PASS"
      - name: Assert output file is JSON (not SARIF)
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -s "$F" ]; then echo "FAIL: output file missing"; exit 1; fi
          head -c 600 "$F"; echo
          python3 - "$F" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if isinstance(d, dict) and "$schema" in d and "sarif" in str(d.get("$schema", "")).lower():
              print("FAIL: got SARIF output for format=json")
              sys.exit(1)
          print("valid JSON output")
          EOF
          echo "PASS"
