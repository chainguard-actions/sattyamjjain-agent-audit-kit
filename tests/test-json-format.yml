name: Test JSON output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert action ran without error
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "exit-code:      $EXIT_CODE"
          echo "findings-count: $FINDINGS"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action step failed unexpectedly"
            exit 1
          fi

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          # With fail-on=none, exit code should always be 0
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi

          echo "PASS: JSON format scan completed successfully"
