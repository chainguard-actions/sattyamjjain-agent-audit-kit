name: Test scan with JSON format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action ran and exit-code is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, exit-code=$EXIT_CODE)"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a number: '$FINDINGS'"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS"
          else
            echo "PASS: action failed gracefully (scan error or sentinel repo)"
          fi

      - name: Assert sarif-file output is always set (even for JSON format)
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF_FILE" ]; then
              echo "FAIL: sarif-file output should always be set"
              exit 1
            fi
            echo "PASS: sarif-file=$SARIF_FILE"
          else
            echo "PASS: action failed gracefully"
          fi
