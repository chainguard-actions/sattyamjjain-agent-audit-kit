name: Test JSON output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with JSON format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or scan error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert critical-count output is numeric
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "critical-count: $CRITICAL"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping output assertion"
            exit 0
          fi
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL'"
            exit 1
          fi
          echo "PASS: critical-count=$CRITICAL"

      - name: Assert high-count output is numeric
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "high-count: $HIGH"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping output assertion"
            exit 0
          fi
          if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count is not a non-negative integer: '$HIGH'"
            exit 1
          fi
          echo "PASS: high-count=$HIGH"
