name: Test JSON format scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert scan completed
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: scan step failed unexpectedly (fail-on=none should never fail)"
            exit 1
          fi

          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi

          echo "PASS: JSON format scan completed with findings=$FINDINGS"

      - name: Assert exit-code output is numeric
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: exit-code is not a numeric value: '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is numeric: $EXIT_CODE"
