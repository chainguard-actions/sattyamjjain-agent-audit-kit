name: Test JSON format scan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan step ran (not skipped)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: scan step was skipped"
            exit 1
          fi
          echo "PASS: scan step ran with outcome=$OUTCOME"

      - name: Assert findings-count output is numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: findings-count output is empty on success"
              exit 1
            fi
            # Verify it's a non-negative integer
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS (numeric)"
          else
            echo "PASS: action failed gracefully (outcome=$OUTCOME)"
          fi

      - name: Assert critical-count output is numeric
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "critical-count: $CRITICAL"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CRITICAL" ]; then
              echo "FAIL: critical-count output is empty on success"
              exit 1
            fi
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count is not a non-negative integer: $CRITICAL"
              exit 1
            fi
            echo "PASS: critical-count=$CRITICAL (numeric)"
          else
            echo "PASS: action failed gracefully (outcome=$OUTCOME)"
          fi

      - name: Assert high-count output is numeric
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "high-count: $HIGH"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HIGH" ]; then
              echo "FAIL: high-count output is empty on success"
              exit 1
            fi
            if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
              echo "FAIL: high-count is not a non-negative integer: $HIGH"
              exit 1
            fi
            echo "PASS: high-count=$HIGH (numeric)"
          else
            echo "PASS: action failed gracefully (outcome=$OUTCOME)"
          fi
