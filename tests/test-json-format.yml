name: Test JSON output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan ran and outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # sarif-file output should always be set (even for json format, the output key is sarif-file)
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file output is '$SARIF_FILE'"

          # findings-count should be a number
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a number"
            exit 1
          fi
          echo "PASS: findings-count is a valid number: $FINDINGS"

          # exit-code should be 0, 1, or 2
          if ! echo "$EXIT_CODE" | grep -qE '^[0-2]$'; then
            echo "FAIL: exit-code '$EXIT_CODE' is not 0, 1, or 2"
            exit 1
          fi
          echo "PASS: exit-code is valid: $EXIT_CODE"
