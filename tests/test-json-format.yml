name: Test JSON output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"
          echo "findings-count: $FINDINGS_COUNT"

          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — validating outputs"

            if [ -z "$SARIF_FILE" ]; then
              echo "FAIL: sarif-file output is empty"
              exit 1
            fi
            echo "PASS: sarif-file=$SARIF_FILE"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: exit-code=$EXIT_CODE"

            if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS_COUNT'"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS_COUNT"

          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
