name: Test json output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/vulnerable-project
          fail-on: none
          format: json
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: disabled
      - name: Assert json output written
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTFILE: ${{ steps.action.outputs.sarif-file }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "exit-code=$EXIT_CODE file=$OUTFILE findings=$FINDINGS"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: exit-code should be 0"; exit 1; fi
          if [ "$OUTFILE" != "agent-audit-results.sarif" ]; then echo "FAIL: unexpected output file"; exit 1; fi
          case "$FINDINGS" in ''|*[!0-9]*) echo "FAIL: findings-count not numeric"; exit 1;; esac
          if [ ! -s "$GITHUB_WORKSPACE/$OUTFILE" ]; then echo "FAIL: output file missing/empty"; exit 1; fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$GITHUB_WORKSPACE/$OUTFILE" || { echo "FAIL: output is not valid JSON"; exit 1; }
          echo "PASS"
