name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan completed without error
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome:   $OUTCOME"
          echo "exit-code: $EXIT_CODE"

          # exit code 2 means the tool itself errored (not a findings threshold)
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: action returned error exit code 2"
            exit 1
          fi

          # The step should not have failed with an unexpected error
          if [ "$OUTCOME" = "failure" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: step failed unexpectedly (outcome=$OUTCOME, exit-code=$EXIT_CODE)"
            exit 1
          fi

          echo "PASS: scan completed in JSON format without tool error"

      - name: Assert findings-count output is numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"
