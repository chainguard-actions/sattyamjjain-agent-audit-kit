name: Test scan with JSON output format
on:
  workflow_dispatch:

jobs:
  test-json-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "# Test project" > "$GITHUB_WORKSPACE/scan-target/README.md"

      - id: scan
        uses: .
        with:
          path: 'scan-target'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action ran with JSON format
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count:     $HIGH"
          echo "exit-code:      $EXIT_CODE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (fail-on=none), got outcome=$OUTCOME"
            exit 1
          fi

          # exit-code must not be 2 (error)
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned exit-code=2 (error)"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

          # critical-count must be a non-negative integer
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL'"
            exit 1
          fi
          echo "PASS: critical-count=$CRITICAL"

          # high-count must be a non-negative integer
          if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count is not a non-negative integer: '$HIGH'"
            exit 1
          fi
          echo "PASS: high-count=$HIGH"
