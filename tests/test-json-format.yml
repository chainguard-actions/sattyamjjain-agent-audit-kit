name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action completed and outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF"

          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi
            if [ "$EXIT_CODE" != "0" ]; then
              echo "WARN: exit-code is $EXIT_CODE (expected 0 with fail-on=none)"
            fi
            echo "PASS: JSON format scan completed with findings-count=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error is acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
