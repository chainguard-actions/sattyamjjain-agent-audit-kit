name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/act-vulnerable
          format: json
          fail-on: none
          upload-sarif: 'false'
          comment-on-pr: 'false'
      - name: Assert JSON report written
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTFILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "exit=$EXIT_CODE file=$OUTFILE"
          [ "$EXIT_CODE" = "0" ] || { echo "FAIL: exit-code"; exit 1; }
          F="$GITHUB_WORKSPACE/$OUTFILE"
          [ -s "$F" ] || { echo "FAIL: output file missing/empty"; exit 1; }
          head -c 300 "$F"; echo
          FIRST="$(tr -d '[:space:]' < "$F" | head -c 1)"
          if [ "$FIRST" != "{" ] && [ "$FIRST" != "[" ]; then
            echo "FAIL: output is not JSON"; exit 1
          fi
          echo "PASS"
