name: Test JSON output format
on:
  workflow_dispatch:

jobs:
  test-json-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'json'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code and findings outputs are valid or action failed gracefully
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT_CODE" ]; then
              echo "FAIL: exit-code output is empty"
              exit 1
            fi
            if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
              echo "FAIL: unexpected exit-code value '$EXIT_CODE' (expected 0, 1, or 2)"
              exit 1
            fi
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: findings-count output is empty"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
              exit 1
            fi
            if [ -z "$CRITICAL" ]; then
              echo "FAIL: critical-count output is empty"
              exit 1
            fi
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count '$CRITICAL' is not a non-negative integer"
              exit 1
            fi
            echo "PASS: JSON format outputs are valid, exit-code=$EXIT_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
