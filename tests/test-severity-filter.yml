name: Test severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'high'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert all outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"

          FAIL=0
          if [ -z "$FINDINGS" ]; then echo "FAIL: findings-count is empty"; FAIL=1; fi
          if [ -z "$CRITICAL" ]; then echo "FAIL: critical-count is empty"; FAIL=1; fi
          if [ -z "$HIGH" ]; then echo "FAIL: high-count is empty"; FAIL=1; fi
          if [ -z "$SARIF_FILE" ]; then echo "FAIL: sarif-file is empty"; FAIL=1; fi
          if [ -z "$EXIT_CODE" ]; then echo "FAIL: exit-code is empty"; FAIL=1; fi

          if [ "$FAIL" = "1" ]; then
            echo "FAIL: one or more outputs were empty"
            exit 1
          fi
          echo "PASS: all outputs are set"

      - name: Assert exit-code is 0 with fail-on none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS"

      - name: Assert SARIF file is valid and findings are high/critical only
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: SARIF file not found"
            exit 1
          fi
          python3 -c "
          import json
          with open('$SARIF_PATH') as f:
              sarif = json.load(f)
          runs = sarif.get('runs', [])
          assert len(runs) > 0, 'No runs in SARIF'
          results = runs[0].get('results', [])
          rules = {r['id']: r for r in runs[0].get('tool', {}).get('driver', {}).get('rules', [])}
          # With severity=high, all findings should be high or critical (score >= 7.0)
          for r in results:
              rule = rules.get(r.get('ruleId', ''), {})
              score = float(rule.get('properties', {}).get('security-severity', '0'))
              assert score >= 7.0, f'Found finding below high severity: score={score}, rule={r.get(\"ruleId\")}'
          print(f'PASS: {len(results)} findings, all at high/critical severity')
          "
