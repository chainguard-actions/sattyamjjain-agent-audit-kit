name: Test severity filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'high'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"

      - name: Assert exit-code is 0 with fail-on none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: expected exit-code=0 when fail-on=none, got '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: exit-code=0 as expected"
          else
            echo "PASS: action failed gracefully"
          fi

      - name: Assert findings-count is a number
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a number: '$FINDINGS'"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS (high+ severity only)"
          else
            echo "PASS: action failed gracefully"
          fi
