name: Test fail-on=none always passes
on:
  workflow_dispatch:

jobs:
  test-fail-on-none:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          format: 'sarif'
          severity: 'low'
          fail-on: 'none'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert action passed with exit-code 0
        env:
          EXIT: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT"
          echo "findings-count: $FINDINGS"
          echo "sarif-file: $SARIF"

          if [ "$OUTCOME" = "success" ]; then
            # With fail-on=none, exit code must always be 0
            if [ "$EXIT" != "0" ]; then
              echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT"
              exit 1
            fi

            # sarif-file output must be set
            if [ -z "$SARIF" ]; then
              echo "FAIL: sarif-file output is empty"
              exit 1
            fi

            echo "PASS: action passed with fail-on=none and exit-code=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error under act)"
          else
            echo "INFO: step outcome was '$OUTCOME' (skipped/cancelled) — treating as graceful non-run"
            echo "PASS"
          fi
