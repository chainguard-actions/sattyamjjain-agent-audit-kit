name: Test fail-on none always passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code is a valid value when set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "INFO: exit-code output was not set (action may have failed to run)"
          elif [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: unexpected exit-code value: $EXIT_CODE"
            exit 1
          else
            echo "PASS: exit-code=${EXIT_CODE} is a valid value"
          fi

      - name: Assert findings-count is a non-negative integer when set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -n "$FINDINGS" ] && ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=${FINDINGS:-<empty>}"

      - name: Assert sarif-file output contains expected filename when set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -n "$SARIF_FILE" ] && ! echo "$SARIF_FILE" | grep -q 'agent-audit-results.sarif'; then
            echo "FAIL: expected sarif-file to contain agent-audit-results.sarif, got $SARIF_FILE"
            exit 1
          fi
          echo "PASS: sarif-file=${SARIF_FILE:-<not set>}"
