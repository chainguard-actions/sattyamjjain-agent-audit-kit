name: Test fail-on none always exits 0
on:
  workflow_dispatch:

jobs:
  test-fail-on-none:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert exit-code is 0 when fail-on is none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 when fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected"

      - name: Assert findings-count is a non-negative integer
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert critical-count is a non-negative integer
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count '$CRITICAL' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: critical-count is '$CRITICAL'"

      - name: Assert high-count is a non-negative integer
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "high-count: $HIGH"
          if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count '$HIGH' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: high-count is '$HIGH'"
