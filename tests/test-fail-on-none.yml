name: Test fail-on=none always passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert action ran (outcome is not cancelled)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "scan outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"

      - name: Assert exit-code is 0 when fail-on=none (if set)
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "WARN: exit-code output is empty (action may have errored)"
          elif [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          else
            echo "PASS: exit-code=0 as expected"
          fi

      - name: Assert all numeric outputs are valid (if set)
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"

          for VAR in "$FINDINGS" "$CRITICAL" "$HIGH"; do
            if [ -z "$VAR" ]; then
              echo "WARN: output '$VAR' is empty"
              continue
            fi
            if ! echo "$VAR" | grep -qE '^[0-9]+$'; then
              echo "FAIL: output '$VAR' is not a non-negative integer"
              exit 1
            fi
          done

          if [ -n "$CRITICAL" ] && [ -n "$FINDINGS" ] && [ "$CRITICAL" -gt "$FINDINGS" ]; then
            echo "FAIL: critical-count ($CRITICAL) > findings-count ($FINDINGS)"
            exit 1
          fi
          if [ -n "$HIGH" ] && [ -n "$FINDINGS" ] && [ "$HIGH" -gt "$FINDINGS" ]; then
            echo "FAIL: high-count ($HIGH) > findings-count ($FINDINGS)"
            exit 1
          fi

          echo "PASS: all numeric outputs are valid"

      - name: Assert sarif-file output is set (if action succeeded)
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] && [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty but action succeeded"
            exit 1
          fi
          echo "PASS: sarif-file='$SARIF_FILE'"
