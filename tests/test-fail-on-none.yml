name: Test fail-on none always passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: 'tests/fixtures/clean-project'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code is 0 when fail-on is none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 when fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected with fail-on=none"

      - name: Assert sarif-file output matches expected filename
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF"
          if [ "$SARIF" != "agent-audit-results.sarif" ]; then
            echo "FAIL: expected sarif-file to be 'agent-audit-results.sarif', got '$SARIF'"
            exit 1
          fi
          echo "PASS: sarif-file is 'agent-audit-results.sarif'"

      - name: Assert SARIF file is valid JSON
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/$SARIF"
          echo "Checking SARIF file at: $SARIF_PATH"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: SARIF file not found at $SARIF_PATH"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('$SARIF_PATH'))" 2>/dev/null; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"

      - name: Assert SARIF has expected structure
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/$SARIF"
          echo "Checking SARIF structure at: $SARIF_PATH"
          python3 -c "
          import json, sys
          with open('$SARIF_PATH') as f:
              sarif = json.load(f)
          if 'runs' not in sarif:
              print('FAIL: SARIF file missing expected top-level key: runs')
              sys.exit(1)
          print('PASS: SARIF file has expected structure')
          "
