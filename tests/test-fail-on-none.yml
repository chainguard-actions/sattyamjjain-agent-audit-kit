name: Test fail-on none always passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code is 0 when fail-on is none
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $CODE"
          if [ "$CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 with fail-on=none, got '$CODE'"
            exit 1
          fi
          echo "PASS: exit-code=0 as expected with fail-on=none"

      - name: Assert findings-count is a non-negative integer
        env:
          COUNT: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$COUNT'"
            exit 1
          fi
          echo "PASS: findings-count=$COUNT"
