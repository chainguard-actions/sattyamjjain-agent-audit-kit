name: Test fail-on none always passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan succeeded (fail-on=none should never fail)
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with fail-on=none, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: scan succeeded as expected with fail-on=none"

          # With fail-on=none, exit code should be 0
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected"
