name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: '.'
          format: 'sarif'
          severity: 'low'
          fail-on: 'none'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file is set to '$SARIF_FILE'"

      - name: Assert SARIF file exists in workspace
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file: $GITHUB_WORKSPACE/$SARIF_FILE"
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF_FILE" ]; then
            echo "FAIL: SARIF file not found at $GITHUB_WORKSPACE/$SARIF_FILE"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON with runs key
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Validating SARIF structure..."
          python3 -c "
          import json, sys, os
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], os.environ['SARIF_FILE'])
          with open(path) as f:
              sarif = json.load(f)
          if 'runs' not in sarif:
              print('FAIL: SARIF missing runs key')
              sys.exit(1)
          print('PASS: SARIF has runs key with', len(sarif['runs']), 'run(s)')
          "
