name: Test SARIF file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert SARIF file output is set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code:  $EXIT_CODE"

          # exit code 2 means the tool itself errored
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: action returned error exit code 2"
            exit 1
          fi

          # sarif-file output must be set
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi

          echo "PASS: sarif-file output is '$SARIF_FILE'"

      - name: Assert SARIF file exists in workspace
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file: $GITHUB_WORKSPACE/$SARIF_FILE"
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF_FILE" ]; then
            echo "FAIL: SARIF file not found at $GITHUB_WORKSPACE/$SARIF_FILE"
            # List workspace to help debug
            ls -la "$GITHUB_WORKSPACE/" || true
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Validating SARIF JSON at $GITHUB_WORKSPACE/$SARIF_FILE"
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/$SARIF_FILE'))" 2>&1; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"

      - name: Assert SARIF has expected structure
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          python3 - <<'EOF'
          import json, sys, os
          sarif_path = os.path.join(os.environ['GITHUB_WORKSPACE'], os.environ['SARIF_FILE'])
          with open(sarif_path) as f:
              sarif = json.load(f)
          # SARIF must have a version field
          if 'version' not in sarif:
              print("FAIL: SARIF missing 'version' field")
              sys.exit(1)
          # SARIF must have runs array
          if 'runs' not in sarif or not isinstance(sarif['runs'], list):
              print("FAIL: SARIF missing 'runs' array")
              sys.exit(1)
          print(f"PASS: SARIF version={sarif['version']}, runs={len(sarif['runs'])}")
          EOF
