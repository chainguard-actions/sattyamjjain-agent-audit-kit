name: Test SARIF output file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true
      - name: Assert sarif-file output is set and file exists
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          if [ ! -f "$SARIF_FILE" ]; then
            echo "FAIL: SARIF file does not exist at $SARIF_FILE"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"
