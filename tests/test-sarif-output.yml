name: Test SARIF file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'true'
          comment-on-pr: 'false'
      - name: Assert SARIF file output is set
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF_FILE" ]; then
              echo "FAIL: sarif-file output is empty on success"
              exit 1
            fi
            echo "PASS: sarif-file output is set to '$SARIF_FILE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
