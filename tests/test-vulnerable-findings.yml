name: Test vulnerable project reports findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/vulnerable
          fail-on: none
          comment-on-pr: 'false'
      - name: Assert outputs
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "findings=$FINDINGS critical=$CRITICAL high=$HIGH sarif=$SARIF exit=$EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit-code 0"; exit 1; fi
          if [ "$SARIF" != "agent-audit-results.sarif" ]; then echo "FAIL: unexpected sarif-file"; exit 1; fi
          if ! [ "$FINDINGS" -gt 0 ] 2>/dev/null; then echo "FAIL: expected findings-count > 0"; exit 1; fi
          case "$CRITICAL" in ''|*[!0-9]*) echo "FAIL: critical-count not numeric"; exit 1;; esac
          case "$HIGH" in ''|*[!0-9]*) echo "FAIL: high-count not numeric"; exit 1;; esac
          echo "PASS"
      - name: Assert SARIF file is valid and matches count
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$F" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          N=$(python3 -c "import json;d=json.load(open('$F'));print(len(d['runs'][0].get('results',[])))")
          echo "results in SARIF: $N"
          if [ "$N" != "$FINDINGS" ]; then echo "FAIL: SARIF result count mismatch"; exit 1; fi
          echo "PASS"
