name: Test scan detects findings in vulnerable project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/vulnerable-project
          fail-on: none
      - name: Assert findings reported
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
        run: |
          echo "exit-code=$EXIT_CODE findings=$FINDINGS critical=$CRITICAL high=$HIGH"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: exit-code should be 0 with fail-on none"; exit 1; fi
          case "$FINDINGS" in ''|*[!0-9]*) echo "FAIL: findings-count not numeric"; exit 1;; esac
          if [ "$FINDINGS" -lt 1 ]; then echo "FAIL: expected findings in vulnerable project"; exit 1; fi
          if [ $((CRITICAL + HIGH)) -gt "$FINDINGS" ]; then echo "FAIL: critical+high exceeds total"; exit 1; fi
          python3 - <<'EOF'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "agent-audit-results.sarif")))
          n = len(d["runs"][0].get("results", []))
          print("sarif results:", n)
          if n != int(os.environ["FINDINGS"]):
              print("FAIL: SARIF result count does not match findings-count"); sys.exit(1)
          EOF
          echo "PASS"
