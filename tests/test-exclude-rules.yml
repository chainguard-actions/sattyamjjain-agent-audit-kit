name: Test exclude-rules and ignore-paths inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: '.git,node_modules'
          fingerprint-strategy: 'disabled'

      - name: Assert action completed successfully
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0"

      - name: Assert findings-count is numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"

      - name: Assert SARIF file is valid JSON with expected structure
        run: |
          python3 -c "
          import json
          with open('$GITHUB_WORKSPACE/agent-audit-results.sarif') as f:
              sarif = json.load(f)
          assert 'runs' in sarif, 'Missing runs key in SARIF'
          assert len(sarif['runs']) > 0, 'No runs in SARIF'
          run = sarif['runs'][0]
          assert 'results' in run, 'Missing results key in SARIF run'
          print('PASS: SARIF structure is valid, results count:', len(run['results']))
          "
