name: Test exclude-rules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # First scan without exclusions
      - id: scan-full
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      # Second scan with some rules excluded (using a preset to limit scope)
      - id: scan-excluded
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          exclude-rules: 'AAK-MCP-001,AAK-MCP-002'
        continue-on-error: true

      - name: Assert both scans ran successfully
        env:
          FULL_FINDINGS: ${{ steps.scan-full.outputs.findings-count }}
          FULL_EXIT: ${{ steps.scan-full.outputs.exit-code }}
          FULL_OUTCOME: ${{ steps.scan-full.outcome }}
          EXCL_FINDINGS: ${{ steps.scan-excluded.outputs.findings-count }}
          EXCL_EXIT: ${{ steps.scan-excluded.outputs.exit-code }}
          EXCL_OUTCOME: ${{ steps.scan-excluded.outcome }}
        run: |
          echo "full scan outcome: $FULL_OUTCOME"
          echo "full scan findings: $FULL_FINDINGS"
          echo "full scan exit-code: $FULL_EXIT"
          echo "excluded scan outcome: $EXCL_OUTCOME"
          echo "excluded scan findings: $EXCL_FINDINGS"
          echo "excluded scan exit-code: $EXCL_EXIT"

          if [ "$FULL_OUTCOME" = "failure" ]; then
            echo "FAIL: full scan step failed unexpectedly"
            exit 1
          fi

          if [ "$EXCL_OUTCOME" = "failure" ]; then
            echo "FAIL: excluded scan step failed unexpectedly"
            exit 1
          fi

          # Both should return numeric findings counts
          if ! echo "$FULL_FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: full scan findings-count is not a number: '$FULL_FINDINGS'"
            exit 1
          fi

          if ! echo "$EXCL_FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: excluded scan findings-count is not a number: '$EXCL_FINDINGS'"
            exit 1
          fi

          # Both should exit with 0 since fail-on=none
          if [ "$FULL_EXIT" != "0" ]; then
            echo "FAIL: full scan expected exit-code=0, got '$FULL_EXIT'"
            exit 1
          fi

          if [ "$EXCL_EXIT" != "0" ]; then
            echo "FAIL: excluded scan expected exit-code=0, got '$EXCL_EXIT'"
            exit 1
          fi

          # Excluded scan should have <= findings than full scan
          if [ "$EXCL_FINDINGS" -gt "$FULL_FINDINGS" ]; then
            echo "FAIL: excluded scan ($EXCL_FINDINGS) has more findings than full scan ($FULL_FINDINGS)"
            exit 1
          fi

          echo "PASS: full scan=$FULL_FINDINGS findings, excluded scan=$EXCL_FINDINGS findings"
