name: Test exclude-rules and ignore-paths inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: '.git,node_modules,venv'

      - name: Assert scan completed successfully
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: scan with ignore-paths completed with exit-code=0"

      - name: Assert all outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "sarif-file: $SARIF_FILE"
          FAILED=0
          if [ -z "$FINDINGS" ]; then echo "FAIL: findings-count is empty"; FAILED=1; fi
          if [ -z "$CRITICAL" ]; then echo "FAIL: critical-count is empty"; FAILED=1; fi
          if [ -z "$HIGH" ]; then echo "FAIL: high-count is empty"; FAILED=1; fi
          if [ -z "$SARIF_FILE" ]; then echo "FAIL: sarif-file is empty"; FAILED=1; fi
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
          echo "PASS: all outputs are set"

      - name: Assert SARIF file exists and is valid
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: SARIF file not found at $SARIF_PATH"
            exit 1
          fi
          python3 -c "
          import json, sys
          with open('$SARIF_PATH') as f:
              sarif = json.load(f)
          if '\$schema' not in sarif and 'runs' not in sarif:
              print('FAIL: SARIF missing expected keys')
              sys.exit(1)
          print('PASS: SARIF file is valid JSON with expected structure')
          "
