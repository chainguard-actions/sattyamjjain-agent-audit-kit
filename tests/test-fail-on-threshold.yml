name: Test fail-on threshold behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run with fail-on=high (default) — the action may exit 0 (no high findings)
      # or exit 1 (findings exceed threshold). Both are valid outcomes.
      # We use continue-on-error and check that exit-code output is set and numeric.
      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code output is set and valid
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"

          # exit-code must be set
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi

          # exit-code must be 0 (pass), 1 (findings exceed threshold), or 2 (error)
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: unexpected exit-code value '$EXIT_CODE' (expected 0, 1, or 2)"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE is a valid scan exit code"

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"
