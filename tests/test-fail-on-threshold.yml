name: Test fail-on threshold behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With fail-on=none, the action should always exit 0 regardless of findings
      - id: scan-none
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert fail-on=none always exits 0
        env:
          EXIT_CODE: ${{ steps.scan-none.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-none.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action step failed unexpectedly with fail-on=none"
            exit 1
          fi

          # With fail-on=none, exit code should always be 0
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi

          echo "PASS: fail-on=none correctly exits 0"

      # With fail-on=critical, the action should pass unless there are critical findings
      - id: scan-critical
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'critical'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert fail-on=critical outputs are valid
        env:
          FINDINGS: ${{ steps.scan-critical.outputs.findings-count }}
          CRITICAL: ${{ steps.scan-critical.outputs.critical-count }}
          EXIT_CODE: ${{ steps.scan-critical.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-critical.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "exit-code: $EXIT_CODE"

          # The action may succeed or fail depending on findings — both are valid
          if [ "$OUTCOME" = "success" ]; then
            # exit-code must be 0 (no critical findings) or 1 (critical findings found)
            if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ]; then
              echo "FAIL: unexpected exit-code '$EXIT_CODE' (expected 0 or 1)"
              exit 1
            fi
            echo "PASS: fail-on=critical scan completed with exit-code=$EXIT_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed because critical findings exceeded threshold — valid
            echo "PASS: action failed due to critical findings threshold (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
