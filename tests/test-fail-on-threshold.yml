name: Test fail-on threshold behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan-none
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code is 0 when fail-on=none
        env:
          EXIT_CODE: ${{ steps.scan-none.outputs.exit-code }}
        run: |
          echo "exit-code (fail-on=none): $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0 as expected with fail-on=none"

      - id: scan-critical
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'critical'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan-critical ran and produced valid outputs
        env:
          OUTCOME: ${{ steps.scan-critical.outcome }}
          EXIT_CODE: ${{ steps.scan-critical.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-critical.outputs.findings-count }}
          CRITICAL: ${{ steps.scan-critical.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: scan step was unexpectedly skipped"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ -z "$CRITICAL" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: unexpected exit-code $EXIT_CODE (expected 0 or 1)"
            exit 1
          fi
          echo "PASS: scan ran correctly with exit-code=$EXIT_CODE, findings=$FINDINGS, critical=$CRITICAL"
