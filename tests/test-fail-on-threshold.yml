name: Test fail-on threshold fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable-project
          fail-on: low
      - name: Assert step failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE findings=$FINDINGS"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected step failure"; exit 1; fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then echo "FAIL: expected exit-code 1"; exit 1; fi
          if [ -n "$FINDINGS" ] && [ "$FINDINGS" -lt 1 ]; then echo "FAIL: expected findings"; exit 1; fi
          echo "PASS"
