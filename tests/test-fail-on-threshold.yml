name: Test fail-on threshold with clean directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: 'tests/fixtures/clean-target'
          severity: 'low'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code is 0 (no high/critical findings in clean dir)
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          # A clean directory with only a README should produce exit code 0
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 for clean directory, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected for clean directory"

      - name: Assert findings-count is 0 for clean directory
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if [ "$FINDINGS" != "0" ]; then
            echo "FAIL: expected 0 findings in clean directory, got '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count is 0 as expected"

      - name: Assert critical-count is 0 for clean directory
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if [ -z "$CRITICAL" ]; then
            echo "FAIL: critical-count output was not set"
            exit 1
          fi
          if [ "$CRITICAL" != "0" ]; then
            echo "FAIL: expected 0 critical findings in clean directory, got '$CRITICAL'"
            exit 1
          fi
          echo "PASS: critical-count is 0 as expected"

      - name: Assert high-count is 0 for clean directory
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "high-count: $HIGH"
          if [ -z "$HIGH" ]; then
            echo "FAIL: high-count output was not set"
            exit 1
          fi
          if [ "$HIGH" != "0" ]; then
            echo "FAIL: expected 0 high findings in clean directory, got '$HIGH'"
            exit 1
          fi
          echo "PASS: high-count is 0 as expected"
