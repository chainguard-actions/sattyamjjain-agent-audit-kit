name: Test fail-on threshold behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Test 1: fail-on=none should always exit 0
      - id: scan-none
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert fail-on=none always exits 0
        env:
          EXIT_CODE: ${{ steps.scan-none.outputs.exit-code }}
        run: |
          echo "exit-code (fail-on=none): $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0 as expected with fail-on=none"

      # Test 2: fail-on=critical — exit code should be 0 or 1 (valid scan outcomes)
      - id: scan-critical
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'critical'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert fail-on=critical produces valid exit code
        env:
          EXIT_CODE: ${{ steps.scan-critical.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-critical.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code (fail-on=critical): $EXIT_CODE"
          # exit-code 0 = no critical findings, 1 = critical findings found, 2 = error
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned error exit code 2"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE (0=no criticals, 1=criticals found)"

      - name: Assert findings-count is numeric
        env:
          FINDINGS: ${{ steps.scan-critical.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count is empty"
            exit 1
          fi
          # Must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS is a valid integer"
