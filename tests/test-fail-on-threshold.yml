name: Test fail-on threshold behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert scan ran and exit-code is valid
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          echo "high-count: $HIGH"
          echo "critical-count: $CRITICAL"

          # The scan should either succeed (no high+ findings) or fail (high+ findings found)
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # exit-code should be 0 (pass), 1 (findings exceed threshold), or 2 (error)
          if ! echo "$EXIT_CODE" | grep -qE '^[0-2]$'; then
            echo "FAIL: exit-code '$EXIT_CODE' is not 0, 1, or 2"
            exit 1
          fi

          # findings-count should be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi

          # If outcome is failure, exit-code should be 1 (findings exceed threshold)
          if [ "$OUTCOME" = "failure" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: outcome is failure but exit-code is '$EXIT_CODE' (expected 1)"
            exit 1
          fi

          # If outcome is success, exit-code should be 0
          if [ "$OUTCOME" = "success" ] && [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: outcome is success but exit-code is '$EXIT_CODE' (expected 0)"
            exit 1
          fi

          echo "PASS: fail-on threshold behavior is correct"
