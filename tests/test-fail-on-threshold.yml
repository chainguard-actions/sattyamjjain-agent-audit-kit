name: Test fail-on threshold fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          severity: low
          fail-on: low
          comment-on-pr: 'false'
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME exit=$EXIT_CODE findings=$FINDINGS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with fail-on low"; exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code 1, got $EXIT_CODE"; exit 1
          fi
          if [ -n "$FINDINGS" ] && [ "$FINDINGS" -lt 1 ]; then
            echo "FAIL: expected at least one finding, got $FINDINGS"; exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/agent-audit-results.sarif" ]; then
            echo "SARIF written despite failure (expected)"
          else
            echo "FAIL: SARIF file should still be written"; exit 1
          fi
          echo "PASS"
