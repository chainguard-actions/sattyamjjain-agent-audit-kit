name: Test rules filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/vulnerable
          rules: AAK-MCP-001
          fail-on: none
          comment-on-pr: 'false'
      - name: Assert only selected rule reported
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "findings=$FINDINGS exit=$EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit 0"; exit 1; fi
          if [ "$FINDINGS" -lt 1 ]; then echo "FAIL: expected AAK-MCP-001 findings"; exit 1; fi
          python3 - "$GITHUB_WORKSPACE/agent-audit-results.sarif" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          ids = {r.get("ruleId") for r in d["runs"][0].get("results", [])}
          print("rule ids:", sorted(ids))
          bad = ids - {"AAK-MCP-001", "AAK-INTERNAL-SCANNER-FAIL"}
          if bad:
              print("FAIL: unexpected rules reported:", bad); sys.exit(1)
          if "AAK-MCP-001" not in ids:
              print("FAIL: AAK-MCP-001 missing"); sys.exit(1)
          print("PASS")
          EOF
