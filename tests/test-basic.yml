name: Test basic scan with defaults
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: 'tests/fixtures/clean-project'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code output is set to '$EXIT_CODE'"

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count output is set to '$FINDINGS'"

      - name: Assert critical-count output is set
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if [ -z "$CRITICAL" ]; then
            echo "FAIL: critical-count output was not set"
            exit 1
          fi
          echo "PASS: critical-count output is set to '$CRITICAL'"

      - name: Assert high-count output is set
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "high-count: $HIGH"
          if [ -z "$HIGH" ]; then
            echo "FAIL: high-count output was not set"
            exit 1
          fi
          echo "PASS: high-count output is set to '$HIGH'"

      - name: Assert sarif-file output is set
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF"
          if [ -z "$SARIF" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file output is set to '$SARIF'"

      - name: Assert SARIF file exists in workspace
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file: $GITHUB_WORKSPACE/$SARIF"
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF" ]; then
            echo "FAIL: SARIF file not found at $GITHUB_WORKSPACE/$SARIF"
            exit 1
          fi
          echo "PASS: SARIF file exists"
