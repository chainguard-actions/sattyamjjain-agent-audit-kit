name: Test basic scan with SARIF output
on:
  workflow_dispatch:

jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          # Write a minimal README so the directory is non-empty
          echo "# Test project" > "$GITHUB_WORKSPACE/scan-target/README.md"

      - id: scan
        uses: .
        with:
          path: 'scan-target'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "sarif-file:     $SARIF_FILE"
          echo "exit-code:      $EXIT_CODE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (fail-on=none), got outcome=$OUTCOME"
            exit 1
          fi

          # sarif-file output must be set
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"

          # exit-code must be 0 (pass) or 1 (findings) — not 2 (error)
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: scan returned exit-code=2 (error)"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"
