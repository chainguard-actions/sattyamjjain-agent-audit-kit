name: Test basic scan with fail-on none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT_CODE" ]; then
              echo "FAIL: action succeeded but exit-code output is empty"
              exit 1
            fi
            echo "PASS: exit-code output is '$EXIT_CODE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or scan error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: action succeeded but findings-count output is empty"
              exit 1
            fi
            echo "PASS: findings-count is '$FINDINGS'"
          else
            echo "PASS: action failed gracefully"
          fi

      - name: Assert sarif-file output is set
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-file: $SARIF"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF" ]; then
              echo "FAIL: action succeeded but sarif-file output is empty"
              exit 1
            fi
            echo "PASS: sarif-file is '$SARIF'"
          else
            echo "PASS: action failed gracefully"
          fi
