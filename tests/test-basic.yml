name: Test basic scan with default settings
on:
  workflow_dispatch:

jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "sarif-file: $SARIF_FILE"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            # Validate all outputs are set
            for name_val in "findings-count:$FINDINGS" "critical-count:$CRITICAL" "high-count:$HIGH" "sarif-file:$SARIF_FILE" "exit-code:$EXIT_CODE"; do
              name="${name_val%%:*}"
              val="${name_val#*:}"
              if [ -z "$val" ]; then
                echo "FAIL: output '$name' is empty"
                exit 1
              fi
            done
            # Validate counts are non-negative integers
            for val in "$FINDINGS" "$CRITICAL" "$HIGH"; do
              if ! echo "$val" | grep -qE '^[0-9]+$'; then
                echo "FAIL: count '$val' is not a non-negative integer"
                exit 1
              fi
            done
            # With fail-on=none, exit-code must be 0
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: expected exit-code 0 when fail-on=none, got '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: all outputs valid, exit-code=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
