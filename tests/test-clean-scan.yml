name: Test clean directory scan passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale SARIF
        run: rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
      - id: action
        uses: .
        with:
          path: tests/fixtures/aak-clean
      - name: Assert outputs
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
        run: |
          echo "exit-code=$EXIT_CODE sarif=$SARIF findings=$FINDINGS critical=$CRITICAL high=$HIGH"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit-code 0"; exit 1; fi
          if [ "$SARIF" != "agent-audit-results.sarif" ]; then echo "FAIL: unexpected sarif-file"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: findings-count not numeric"; exit 1; fi
          if [ "$CRITICAL" != "0" ] || [ "$HIGH" != "0" ]; then echo "FAIL: expected no critical/high findings"; exit 1; fi
          echo "PASS"
      - name: Assert SARIF file is valid
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$F" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          python3 -c "
          import json, sys
          d = json.load(open('$F'))
          assert 'runs' in d and isinstance(d['runs'], list) and d['runs'], 'no runs'
          print('version:', d.get('version'))
          " || { echo "FAIL: invalid SARIF"; exit 1; }
          echo "PASS"
