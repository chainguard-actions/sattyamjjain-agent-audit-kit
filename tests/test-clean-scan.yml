name: Test clean directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          fail-on: critical
          upload-sarif: 'false'
          comment-on-pr: 'false'
      - name: Assert clean scan passes
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "findings=$FINDINGS critical=$CRITICAL exit=$EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0"; exit 1
          fi
          if [ "$CRITICAL" != "0" ]; then
            echo "FAIL: expected 0 critical findings"; exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count not numeric"; exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/agent-audit-results.sarif" ]; then
            echo "FAIL: SARIF file missing"; exit 1
          fi
          echo "PASS"
