name: Test fail-on critical threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'critical'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan did not error
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "exit-code:      $EXIT_CODE"
          echo "critical-count: $CRITICAL"

          # exit code 2 means the tool itself errored
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: action returned error exit code 2"
            exit 1
          fi

          # critical-count must be a non-negative integer
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL'"
            exit 1
          fi

          echo "PASS: scan completed with fail-on=critical, critical-count=$CRITICAL"
