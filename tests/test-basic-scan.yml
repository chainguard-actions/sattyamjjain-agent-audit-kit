name: Test basic scan with SARIF output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"

      - name: Assert findings-count output is a number
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a number: '$FINDINGS'"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS"
          else
            echo "PASS: action failed gracefully (sentinel repo or scan error)"
          fi

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF_FILE" ]; then
              echo "FAIL: sarif-file output is empty"
              exit 1
            fi
            echo "PASS: sarif-file=$SARIF_FILE"
          else
            echo "PASS: action failed gracefully"
          fi

      - name: Assert critical-count and high-count are numbers
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count is not a number: '$CRITICAL'"
              exit 1
            fi
            if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
              echo "FAIL: high-count is not a number: '$HIGH'"
              exit 1
            fi
            echo "PASS: critical=$CRITICAL high=$HIGH"
          else
            echo "PASS: action failed gracefully"
          fi
