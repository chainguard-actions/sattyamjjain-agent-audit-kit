name: Test basic SARIF scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert findings-count output is set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: all outputs are set"

      - name: Assert SARIF file exists in workspace
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          echo "Checking for SARIF file at: $SARIF_PATH"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: SARIF file not found at $SARIF_PATH"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON with expected structure
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          python3 -c "
          import json, sys
          with open('$SARIF_PATH') as f:
              sarif = json.load(f)
          runs = sarif.get('runs', [])
          assert len(runs) > 0, 'Empty runs array'
          results = runs[0].get('results', None)
          assert results is not None, 'Missing results key'
          print('PASS: SARIF structure is valid')
          print('Total findings: ' + str(len(results)))
          "

      - name: Assert exit-code is 0 when fail-on is none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 when fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected"
