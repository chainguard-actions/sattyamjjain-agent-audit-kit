name: Test basic SARIF scan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert findings-count output is a non-negative integer or empty
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -n "$FINDINGS" ] && ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=${FINDINGS:-<empty>}"

      - name: Assert critical-count output is a non-negative integer or empty
        env:
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if [ -n "$CRITICAL" ] && ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: $CRITICAL"
            exit 1
          fi
          echo "PASS: critical-count=${CRITICAL:-<empty>}"

      - name: Assert high-count output is a non-negative integer or empty
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "high-count: $HIGH"
          if [ -n "$HIGH" ] && ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count is not a non-negative integer: $HIGH"
            exit 1
          fi
          echo "PASS: high-count=${HIGH:-<empty>}"

      - name: Assert exit-code output is valid when set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: unexpected exit-code value: $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=${EXIT_CODE:-<empty>}"

      - name: Check SARIF file in workspace if present
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          echo "Checking for SARIF file at: $SARIF_PATH"
          if [ -f "$SARIF_PATH" ]; then
            echo "SARIF file found, validating JSON..."
            if python3 -c "import json; json.load(open('$SARIF_PATH'))" 2>/dev/null; then
              echo "PASS: SARIF file is valid JSON"
            else
              echo "FAIL: SARIF file is not valid JSON"
              exit 1
            fi
          else
            echo "INFO: SARIF file not found at $SARIF_PATH (action may have failed to produce it)"
          fi
