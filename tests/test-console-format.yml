name: Test console output format with critical severity filter
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'console'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          if ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: exit-code '$EXIT_CODE' is not numeric"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert exit-code is 0 with fail-on=none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected with fail-on=none"

      - name: Assert findings-count is set and numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not numeric"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"
