name: Test console output format with critical severity
on:
  workflow_dispatch:

jobs:
  test-console-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'console'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is a number
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS'"

      - name: Assert sarif-file output is set
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF"
          if [ -z "$SARIF" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file is '$SARIF'"
