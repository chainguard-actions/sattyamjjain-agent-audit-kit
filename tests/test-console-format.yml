name: Test console output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'critical'
          fail-on: 'none'
          format: 'console'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert action ran successfully with console format
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code:      $EXIT_CODE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed (outcome=$OUTCOME)"
            exit 1
          fi

          # With fail-on=none, exit-code must always be 0
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          echo "PASS: console format scan completed with exit-code=0"
