name: Test console format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: '.'
          format: 'console'
          severity: 'low'
          fail-on: 'none'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert outputs are set for console format
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "exit-code: $EXIT_CODE"
          FAILED=0
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count not set"
            FAILED=1
          fi
          if [ -z "$CRITICAL" ]; then
            echo "FAIL: critical-count not set"
            FAILED=1
          fi
          if [ -z "$HIGH" ]; then
            echo "FAIL: high-count not set"
            FAILED=1
          fi
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code not set"
            FAILED=1
          fi
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
          echo "PASS: all outputs set for console format"
