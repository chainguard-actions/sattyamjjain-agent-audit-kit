name: Test scan with console format
on:
  workflow_dispatch:

jobs:
  test-console-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'high'
          fail-on: 'none'
          format: 'console'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert exit-code is 0 (fail-on none)
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0"

      - name: Assert high-count is a number
        env:
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "high-count: $HIGH"
          if [ -z "$HIGH" ]; then
            echo "FAIL: high-count output is empty"
            exit 1
          fi
          if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
            echo "FAIL: high-count is not a number: $HIGH"
            exit 1
          fi
          echo "PASS: high-count=$HIGH (numeric)"

      - name: Assert sarif-file output is set (even for console format)
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF"
          if [ -z "$SARIF" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF"
