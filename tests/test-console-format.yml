name: Test console format scan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'high'
          fail-on: 'none'
          format: 'console'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert scan step ran (not skipped)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: scan step was skipped"
            exit 1
          fi
          echo "PASS: scan step ran with outcome=$OUTCOME"

      - name: Assert exit-code is 0 when fail-on is none
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "exit-code: $EXIT_CODE"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT_CODE" ]; then
              echo "FAIL: exit-code output is empty on success"
              exit 1
            fi
            # With fail-on=none, exit code should always be 0
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
              exit 1
            fi
            echo "PASS: exit-code=$EXIT_CODE (0 as expected with fail-on=none)"
          else
            echo "PASS: action failed gracefully (outcome=$OUTCOME)"
          fi

      - name: Assert findings-count is set and numeric
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: findings-count output is empty on success"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS"
          else
            echo "PASS: action failed gracefully (outcome=$OUTCOME)"
          fi
