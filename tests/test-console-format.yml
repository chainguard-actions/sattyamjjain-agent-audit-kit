name: Test console output format
on:
  workflow_dispatch:

jobs:
  test-console-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          format: 'console'
          severity: 'high'
          fail-on: 'none'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert action ran successfully
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT"

          if [ "$OUTCOME" = "success" ]; then
            # findings-count should be a non-negative integer
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi

            # exit-code should be 0 when fail-on=none
            if [ "$EXIT" != "0" ]; then
              echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT"
              exit 1
            fi

            echo "PASS: console format scan completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error under act)"
          else
            echo "INFO: step outcome was '$OUTCOME' (skipped/cancelled) — treating as graceful non-run"
            echo "PASS"
          fi
