name: Test console output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'high'
          fail-on: 'none'
          format: 'console'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        continue-on-error: true

      - name: Assert exit-code is valid when set
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: unexpected exit-code value: $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=${EXIT_CODE:-<empty>}"

      - name: Assert findings-count is numeric when set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if [ -n "$FINDINGS" ] && ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: findings-count=${FINDINGS:-<empty>}"

      - name: Assert high-count does not exceed findings-count when both set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "high-count: $HIGH"
          if [ -n "$FINDINGS" ] && [ -n "$HIGH" ]; then
            if [ "$HIGH" -gt "$FINDINGS" ]; then
              echo "FAIL: high-count ($HIGH) exceeds findings-count ($FINDINGS)"
              exit 1
            fi
            echo "PASS: high-count <= findings-count"
          else
            echo "INFO: one or both counts not set, skipping comparison"
          fi
