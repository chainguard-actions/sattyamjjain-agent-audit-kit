name: Test invalid fail-on value errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare project directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/aak-invalid"
          mkdir -p "$GITHUB_WORKSPACE/aak-invalid"
          echo "# x" > "$GITHUB_WORKSPACE/aak-invalid/README.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: aak-invalid
          fail-on: bogus
          comment-on-pr: 'false'
      - name: Assert action errored
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit=$EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected step failure"; exit 1; fi
          if [ "$EXIT_CODE" != "2" ]; then echo "FAIL: expected exit-code 2 (usage error)"; exit 1; fi
          echo "PASS"
