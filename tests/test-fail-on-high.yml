name: Test fail-on high threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
        # The action may fail (exit 1) if high findings are found or scanners crash
        continue-on-error: true

      - name: Assert exit-code is 0 or 1 (not 2=error)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "exit-code:      $EXIT"
          echo "findings-count: $FINDINGS"
          echo "high-count:     $HIGH"
          echo "critical-count: $CRITICAL"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — validate outputs
            if [ -z "$EXIT" ]; then
              echo "FAIL: exit-code output is empty (action succeeded but wrote no outputs)"
              exit 1
            fi
            if [ "$EXIT" = "2" ]; then
              echo "FAIL: action returned exit-code=2 (internal error)"
              exit 1
            fi
            if [ "$EXIT" != "0" ] && [ "$EXIT" != "1" ]; then
              echo "FAIL: unexpected exit-code '$EXIT' (expected 0 or 1)"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi
            if ! echo "$HIGH" | grep -qE '^[0-9]+$'; then
              echo "FAIL: high-count is not a non-negative integer: '$HIGH'"
              exit 1
            fi
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL'"
              exit 1
            fi
            echo "PASS: fail-on=high scan completed with exit-code=$EXIT (0=pass, 1=findings exceed threshold or scanner failure)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
