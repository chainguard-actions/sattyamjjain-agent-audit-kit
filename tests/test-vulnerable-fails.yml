name: Test vulnerable project fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable-project
          fail-on: low
          comment-on-pr: 'false'
      - name: Assert action failed with findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          TOTAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE findings=$TOTAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the step to fail"
            exit 1
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code 1"
            exit 1
          fi
          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || [ "$TOTAL" -lt 1 ]; then
            echo "FAIL: expected at least one finding"
            exit 1
          fi
          echo "PASS"
      - name: Assert SARIF contains results
        run: |
          f="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$f" ]; then
            echo "FAIL: SARIF file missing"
            exit 1
          fi
          python3 - "$f" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          n = len(d["runs"][0].get("results", []))
          print("results:", n)
          assert n > 0, "no results in SARIF"
          EOF
          echo "PASS"
