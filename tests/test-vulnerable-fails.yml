name: Test vulnerable config fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/act-vulnerable
          fail-on: high
          comment-on-pr: 'false'
      - name: Assert scan failed on findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME exit=$EXIT_CODE findings=$FINDINGS"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure outcome"; exit 1; }
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code 1"; exit 1
          fi
          if [ -n "$FINDINGS" ] && [ "$FINDINGS" -le 0 ]; then
            echo "FAIL: expected findings > 0"; exit 1
          fi
          echo "PASS"
