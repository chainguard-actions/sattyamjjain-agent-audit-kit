name: Test vulnerable project fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale SARIF
        run: rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable-project
          fail-on: high
          comment-on-pr: 'false'
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then echo "FAIL: expected exit-code 1"; exit 1; fi
          echo "PASS"
      - name: Assert SARIF contains findings
        run: |
          f="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$f" ]; then echo "FAIL: SARIF not found"; exit 1; fi
          n=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d['runs'][0].get('results', [])))" "$f")
          echo "results: $n"
          if [ "$n" -lt 1 ]; then echo "FAIL: expected findings in SARIF"; exit 1; fi
          echo "PASS"
