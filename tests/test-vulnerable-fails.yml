name: Test vulnerable config fails at default threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale SARIF
        run: rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/aak-vulnerable
      - name: Assert action failed with findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE findings=$FINDINGS critical=$CRITICAL high=$HIGH"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected step failure"; exit 1; fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then echo "FAIL: expected exit-code 1"; exit 1; fi
          if [ -n "$FINDINGS" ] && [ "$FINDINGS" -lt 1 ]; then echo "FAIL: expected findings"; exit 1; fi
          echo "PASS"
      - name: Assert SARIF contains results
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$F" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          N=$(python3 -c "import json; print(len(json.load(open('$F'))['runs'][0].get('results', [])))")
          echo "results: $N"
          if [ "$N" -lt 1 ]; then echo "FAIL: no results in SARIF"; exit 1; fi
          echo "PASS"
