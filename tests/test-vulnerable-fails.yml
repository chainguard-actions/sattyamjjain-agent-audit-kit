name: Test vulnerable project fails threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale SARIF
        run: rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          fail-on: low
          comment-on-pr: 'false'
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE findings=$FINDINGS"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected step failure"; exit 1; fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then echo "FAIL: expected exit-code 1"; exit 1; fi
          if [ -n "$FINDINGS" ] && [ "$FINDINGS" -lt 1 ]; then echo "FAIL: expected findings"; exit 1; fi
          echo "PASS"
      - name: Assert SARIF contains results
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -s "$F" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          python3 - "$F" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          results = d["runs"][0].get("results", [])
          print("results:", len(results))
          for r in results[:20]:
              print(" -", r.get("ruleId"))
          if not results:
              print("FAIL: expected at least one finding")
              sys.exit(1)
          EOF
          echo "PASS"
