name: Test clean project passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          comment-on-pr: 'false'
      - name: Assert clean result
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "exit=$EXIT_CODE critical=$CRITICAL high=$HIGH sarif=$SARIF"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit-code 0"; exit 1; fi
          if [ "$CRITICAL" != "0" ]; then echo "FAIL: expected 0 critical"; exit 1; fi
          if [ "$HIGH" != "0" ]; then echo "FAIL: expected 0 high"; exit 1; fi
          if [ "$SARIF" != "agent-audit-results.sarif" ]; then echo "FAIL: unexpected sarif-file"; exit 1; fi
          if [ ! -f "$GITHUB_WORKSPACE/agent-audit-results.sarif" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          echo "PASS"
