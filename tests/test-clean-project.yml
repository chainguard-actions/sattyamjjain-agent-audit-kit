name: Test scan of a clean project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean project directory
        run: |
          rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
          rm -rf "$GITHUB_WORKSPACE/aak-clean"
          mkdir -p "$GITHUB_WORKSPACE/aak-clean"
          echo "# Clean project" > "$GITHUB_WORKSPACE/aak-clean/README.md"
      - id: action
        uses: .
        with:
          path: aak-clean
          fail-on: high
          comment-on-pr: 'false'
      - name: Assert outputs
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "findings=$FINDINGS critical=$CRITICAL high=$HIGH sarif=$SARIF exit=$EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit-code 0"; exit 1; fi
          if [ "$CRITICAL" != "0" ]; then echo "FAIL: expected 0 critical"; exit 1; fi
          if [ "$HIGH" != "0" ]; then echo "FAIL: expected 0 high"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: findings-count not numeric"; exit 1; fi
          if [ "$SARIF" != "agent-audit-results.sarif" ]; then echo "FAIL: unexpected sarif-file"; exit 1; fi
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert 'runs' in d, 'no runs'" "$GITHUB_WORKSPACE/$SARIF" || { echo "FAIL: invalid SARIF"; exit 1; }
          echo "PASS"
