name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          format: 'sarif'
          severity: 'low'
          fail-on: 'none'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"

      - name: Assert SARIF file exists in workspace
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file: $GITHUB_WORKSPACE/$SARIF_FILE"
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF_FILE" ]; then
            echo "FAIL: SARIF file not found at $GITHUB_WORKSPACE/$SARIF_FILE"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON with expected schema
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Validating SARIF JSON structure..."
          python3 -c "
          import json, sys, os
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], os.environ['SARIF_FILE'])
          with open(path) as f:
              sarif = json.load(f)
          assert 'runs' in sarif, 'Missing runs key'
          assert isinstance(sarif['runs'], list), 'runs is not a list'
          assert len(sarif['runs']) > 0, 'runs is empty'
          print('PASS: SARIF structure is valid')
          print(f'  version: {sarif.get(\"version\", \"unknown\")}')
          print(f'  runs: {len(sarif[\"runs\"])}')
          print(f'  results: {len(sarif[\"runs\"][0].get(\"results\", []))}')
          "

      - name: Assert exit-code is 0 (no findings exceed none threshold)
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=0"
