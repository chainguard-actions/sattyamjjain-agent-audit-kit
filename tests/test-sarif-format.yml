name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert sarif-file output is the expected filename
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ "$SARIF_FILE" != "agent-audit-results.sarif" ]; then
            echo "FAIL: expected sarif-file='agent-audit-results.sarif', got '$SARIF_FILE'"
            exit 1
          fi
          echo "PASS: sarif-file is 'agent-audit-results.sarif'"

      - name: Assert SARIF file exists in workspace
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/agent-audit-results.sarif" ]; then
            echo "FAIL: SARIF file not found in workspace"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        run: |
          python3 -c "
          import json, sys
          with open('$GITHUB_WORKSPACE/agent-audit-results.sarif') as f:
              data = json.load(f)
          assert 'runs' in data, 'SARIF missing runs key'
          print('PASS: SARIF file is valid JSON with runs key')
          "
