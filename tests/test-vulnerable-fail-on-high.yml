name: Test vulnerable project fails with fail-on high
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale SARIF
        run: rm -f "$GITHUB_WORKSPACE/agent-audit-results.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/aak-vulnerable
          fail-on: high
          comment-on-pr: 'false'
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected step failure"; exit 1; fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then echo "FAIL: expected exit-code 1"; exit 1; fi
          echo "PASS"
      - name: Assert SARIF written despite failure
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$F" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          python3 - "$F" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert len(d["runs"][0].get("results", [])) > 0, "no results"
          print("PASS")
          EOF
