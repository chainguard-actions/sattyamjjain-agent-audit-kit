name: Test rule filtering inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Scan with a specific preset to exercise the preset input
      - id: scan-preset
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          preset: 'mcp-ox-2026-04'
        continue-on-error: true

      - name: Assert preset scan produces valid outputs
        env:
          FINDINGS: ${{ steps.scan-preset.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan-preset.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-preset.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code:      $EXIT_CODE"

          # The action must have run (success or failure, not skipped/cancelled)
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          if [ "$OUTCOME" = "success" ]; then
            # findings-count must be a non-negative integer
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi
            echo "PASS: preset scan produced findings-count=$FINDINGS"
          else
            echo "PASS: preset scan failed gracefully (outcome=$OUTCOME)"
          fi

      # Scan with ignore-paths to exercise that input
      - id: scan-ignore
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: 'tests,docs'
        continue-on-error: true

      - name: Assert ignore-paths scan produces valid outputs
        env:
          FINDINGS: ${{ steps.scan-ignore.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan-ignore.outputs.exit-code }}
          OUTCOME: ${{ steps.scan-ignore.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code:      $EXIT_CODE"

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed (outcome=$OUTCOME)"
            exit 1
          fi

          # findings-count must be a non-negative integer
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
            exit 1
          fi

          # exit-code must be 0 (fail-on: none)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
            exit 1
          fi

          echo "PASS: ignore-paths scan produced findings-count=$FINDINGS"
