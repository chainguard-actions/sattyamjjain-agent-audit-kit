name: Test findings reported with fail-on none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/aak-vulnerable
          fail-on: none
          severity: low
          comment-on-pr: 'false'
      - name: Assert findings were detected and exit code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          HIGH: ${{ steps.action.outputs.high-count }}
        run: |
          echo "exit-code=$EXIT_CODE findings=$FINDINGS critical=$CRITICAL high=$HIGH"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: expected exit-code 0 with fail-on none"; exit 1; fi
          case "$FINDINGS" in ''|*[!0-9]*) echo "FAIL: non-numeric findings"; exit 1;; esac
          if [ "$FINDINGS" -lt 1 ]; then echo "FAIL: expected at least one finding"; exit 1; fi
          if [ "$((CRITICAL + HIGH))" -gt "$FINDINGS" ]; then echo "FAIL: critical+high exceeds total"; exit 1; fi
          echo "PASS"
      - name: Assert SARIF contains results
        run: |
          F="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ ! -f "$F" ]; then echo "FAIL: SARIF file missing"; exit 1; fi
          python3 -c "import json; d=json.load(open('$F')); r=d['runs'][0]['results']; print(len(r),'results'); assert len(r)>0"
          echo "PASS"
