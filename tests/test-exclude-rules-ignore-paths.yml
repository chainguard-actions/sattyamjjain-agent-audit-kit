name: Test exclude-rules and ignore-paths inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          # Exclude some rules and ignore some paths to test those inputs
          exclude-rules: 'MCP-001,MCP-002'
          ignore-paths: 'node_modules,.git,vendor'
        continue-on-error: true

      - name: Assert action completed with exclude-rules and ignore-paths
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted exclude-rules and ignore-paths inputs"
            # Validate findings-count is numeric
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi
            echo "PASS: findings-count=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or scan error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert sarif-file output is set when action succeeds
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping output assertion"
            exit 0
          fi
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"
