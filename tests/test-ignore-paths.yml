name: Test ignore-paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: 'tests,docs,.github'
        continue-on-error: true

      - name: Assert action completed with ignore-paths
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "exit-code:      $EXIT"
          echo "findings-count: $FINDINGS"
          echo "sarif-file:     $SARIF"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT" ]; then
              echo "FAIL: exit-code output is empty (action succeeded but wrote no outputs)"
              exit 1
            fi
            if [ "$EXIT" = "2" ]; then
              echo "FAIL: action returned exit-code=2 (internal error)"
              exit 1
            fi
            if [ "$EXIT" != "0" ] && [ "$EXIT" != "1" ]; then
              echo "FAIL: unexpected exit-code '$EXIT' (expected 0 or 1)"
              exit 1
            fi
            if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count is not a non-negative integer: '$FINDINGS'"
              exit 1
            fi
            if [ -z "$SARIF" ]; then
              echo "FAIL: sarif-file output is empty"
              exit 1
            fi
            echo "PASS: ignore-paths scan completed with valid outputs (exit-code=$EXIT)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
