name: Test ignore-paths and exclude-rules inputs
on:
  workflow_dispatch:

jobs:
  test-ignore-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: 'vendor/,third_party/,node_modules/'

      - name: Assert action completed successfully
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty — action may have errored"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "FAIL: action returned error exit code 2"
            exit 1
          fi
          echo "PASS: action completed with exit-code=$EXIT_CODE"

      - name: Assert findings-count is a number
        env:
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is a valid number"
