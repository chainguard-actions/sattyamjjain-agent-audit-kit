name: Test ignore-paths feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Scan with all paths ignored — should produce 0 findings
      - id: scan-ignored
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: '.,*'

      - name: Assert scan with all paths ignored completes successfully
        env:
          EXIT_CODE: ${{ steps.scan-ignored.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-ignored.outputs.findings-count }}
        run: |
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: scan completed with exit-code=$EXIT_CODE, findings=$FINDINGS"

      # Scan without ignore-paths for comparison
      - id: scan-full
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert full scan also completes successfully
        env:
          EXIT_CODE: ${{ steps.scan-full.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-full.outputs.findings-count }}
        run: |
          echo "exit-code: $EXIT_CODE"
          echo "findings-count: $FINDINGS"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          echo "PASS: full scan completed with exit-code=$EXIT_CODE, findings=$FINDINGS"
