name: Test ignore-paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan-with-ignore
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          ignore-paths: 'node_modules,vendor,.git'

      - name: Assert scan with ignore-paths produced valid outputs
        env:
          FINDINGS: ${{ steps.scan-with-ignore.outputs.findings-count }}
          CRITICAL: ${{ steps.scan-with-ignore.outputs.critical-count }}
          HIGH: ${{ steps.scan-with-ignore.outputs.high-count }}
          EXIT_CODE: ${{ steps.scan-with-ignore.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan-with-ignore.outputs.sarif-file }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"
          echo "high-count: $HIGH"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"

          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if [ -z "$CRITICAL" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          if [ -z "$HIGH" ]; then
            echo "FAIL: high-count output is empty"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 with fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: scan with ignore-paths succeeded, all outputs set"

      - name: Assert SARIF file is valid JSON
        run: |
          SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
          if [ -f "$SARIF_PATH" ]; then
            python3 -c "import json; data=json.load(open('$SARIF_PATH')); print('SARIF schema version:', data.get('version', 'unknown'))" \
              && echo "PASS: SARIF file is valid JSON" \
              || { echo "FAIL: SARIF file is not valid JSON"; exit 1; }
          else
            echo "NOTE: SARIF file not found at $SARIF_PATH (may be in container path)"
          fi
