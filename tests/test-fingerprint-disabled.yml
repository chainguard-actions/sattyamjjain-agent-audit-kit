name: Test fingerprint-strategy disabled
on:
  workflow_dispatch:

jobs:
  test-fingerprint-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        name: Run AgentAuditKit scan with fingerprint-strategy disabled
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert scan completed and outputs are set
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "findings-count: $FINDINGS"
          echo "sarif-file: $SARIF"
          echo "exit-code: $EXIT_CODE"

          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 when fail-on=none, got $EXIT_CODE"
            exit 1
          fi
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: $FINDINGS"
            exit 1
          fi
          echo "PASS: fingerprint-strategy=disabled scan completed successfully"
