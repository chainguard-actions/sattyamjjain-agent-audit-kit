name: Test fingerprint-strategy disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'
        continue-on-error: true

      - name: Assert scan ran with disabled fingerprints
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          EXIT: ${{ steps.scan.outputs.exit-code }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "sarif-file: $SARIF"
          echo "exit-code:  $EXIT"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT" ]; then
              echo "FAIL: exit-code output is empty"
              exit 1
            fi
            if ! echo "$EXIT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: exit-code is not numeric: '$EXIT'"
              exit 1
            fi
            echo "PASS: scan with fingerprint-strategy=disabled succeeded, exit-code=$EXIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
