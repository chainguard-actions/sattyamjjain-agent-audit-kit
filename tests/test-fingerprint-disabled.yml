name: Test fingerprint-strategy disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: '.'
          severity: 'low'
          fail-on: 'none'
          format: 'sarif'
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: 'disabled'

      - name: Assert scan step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "sarif-file: $SARIF_FILE"

          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — validating outputs"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: expected exit-code=0 with fail-on=none, got '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: exit-code=$EXIT_CODE"

            if [ -z "$SARIF_FILE" ]; then
              echo "FAIL: sarif-file output is empty"
              exit 1
            fi
            echo "PASS: sarif-file=$SARIF_FILE"

            SARIF_PATH="$GITHUB_WORKSPACE/agent-audit-results.sarif"
            echo "Checking for SARIF at: $SARIF_PATH"
            if [ -f "$SARIF_PATH" ]; then
              echo "PASS: SARIF file exists"
              python3 -c "import json; d=json.load(open('$SARIF_PATH')); assert 'runs' in d, 'Missing runs key'" && echo "PASS: SARIF has expected structure" || echo "WARN: SARIF structure check failed"
            else
              echo "WARN: SARIF file not found at $SARIF_PATH (may be in container working dir)"
            fi

          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker build or scan error under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
