name: Test fingerprint-strategy disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean scan target directory inside workspace
        run: mkdir -p "$GITHUB_WORKSPACE/scan-target-fp"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: scan-target-fp
          severity: low
          fail-on: none
          format: sarif
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fingerprint-strategy: disabled

      - name: Assert exit-code is not an error
        env:
          ACTUAL: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "exit-code: $ACTUAL"
          if [ "$ACTUAL" = "2" ]; then
            echo "FAIL: scan returned error exit code 2 with fingerprint-strategy=disabled"
            exit 1
          fi
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$ACTUAL'"

      - name: Assert findings-count is a number
        env:
          ACTUAL: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "findings-count: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a non-negative integer: '$ACTUAL'"
            exit 1
          fi
          echo "PASS: findings-count=$ACTUAL"

      - name: Assert sarif-file output is set
        env:
          ACTUAL: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "sarif-file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file='$ACTUAL'"

      - name: Assert SARIF file exists in workspace
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file: $GITHUB_WORKSPACE/$SARIF"
          if [ ! -f "$GITHUB_WORKSPACE/$SARIF" ]; then
            echo "FAIL: SARIF file not found at $GITHUB_WORKSPACE/$SARIF"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "Validating SARIF JSON..."
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/$SARIF'))"; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"
